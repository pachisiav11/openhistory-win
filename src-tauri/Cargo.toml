[package]
name = "openhistory-win"
description = "Local-first activity history for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "openhistory-win"

[lib]
name = "openhistory_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
oh-core.workspace = true
oh-collector.workspace = true
oh-processing.workspace = true
oh-inference.workspace = true
oh-mcp.workspace = true

anyhow.workspace = true
chrono.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_Registry"]

[dev-dependencies]
tempfile.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
