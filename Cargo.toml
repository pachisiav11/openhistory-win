[workspace]
resolver = "3"
members = [
    "crates/oh-core",
    "crates/oh-collector",
    "crates/oh-processing",
    "crates/oh-inference",
    "crates/oh-mcp",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pachisiav11/openhistory-win"
authors = ["openhistory-win contributors"]
rust-version = "1.85"

[workspace.dependencies]
oh-core = { path = "crates/oh-core" }
oh-collector = { path = "crates/oh-collector" }
oh-processing = { path = "crates/oh-processing" }
oh-inference = { path = "crates/oh-inference" }
oh-mcp = { path = "crates/oh-mcp" }

anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
windows = "0.62.2"
windows-core = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
